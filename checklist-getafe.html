<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Checklist · CrossFit Metropolitano Getafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#121212;--green:#87B15F;--green-d:#6a9448;
  --gray-l:#EEE9E9;--silver:#C4C0BF;
  --surface:#1C1C1C;--card:#242424;
  --border:rgba(196,192,191,.18);--border-m:rgba(196,192,191,.35);
}
html,body{min-height:100%;background:var(--black);color:var(--gray-l);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:0 0 80px}
/* Header */
.header{position:sticky;top:0;z-index:10;background:var(--black);border-bottom:1px solid var(--border);padding:20px 20px 16px}
.brand{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--silver);text-transform:uppercase;margin-bottom:4px}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.page-title{font-size:22px;font-weight:700;color:var(--gray-l);line-height:1.1}
.date-badge{font-size:11px;font-weight:500;color:var(--black);background:var(--green);padding:4px 10px;border-radius:20px;white-space:nowrap;margin-top:4px}
/* Progress */
.progress-wrap{margin-bottom:14px}
.progress-labels{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-label{font-size:12px;color:var(--silver);font-weight:500}
.progress-count{font-size:13px;font-weight:700;color:var(--gray-l)}
.progress-track{height:4px;background:var(--border-m);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width .3s cubic-bezier(.4,0,.2,1);width:0%}
/* Tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:10px;padding:3px;gap:3px}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.tab-btn.active{background:var(--green);color:var(--black)}
.tab-btn.inactive{background:transparent;color:var(--silver)}
/* Content */
.content{padding:16px 20px 0}
/* Sections */
.section-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.section-icon{width:30px;height:30px;background:rgba(135,177,95,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-icon svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.section-title{font-size:13px;font-weight:700;color:var(--gray-l);letter-spacing:.04em;text-transform:uppercase;flex:1}
.section-count{font-size:11px;font-weight:600;color:var(--silver);background:var(--surface);padding:3px 8px;border-radius:20px}
.section-count.done{background:rgba(135,177,95,.2);color:var(--green)}
/* Items */
.item{display:flex;align-items:flex-start;gap:13px;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.item:last-child{border-bottom:none}
.item:active{background:rgba(255,255,255,.03)}
.checkbox{width:22px;height:22px;min-width:22px;border:2px solid var(--border-m);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px;flex-shrink:0}
.checkbox.on{background:var(--green);border-color:var(--green)}
.checkmark{opacity:0;transform:scale(.5);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.checkbox.on .checkmark{opacity:1;transform:scale(1)}
.item-text{font-size:14px;color:var(--gray-l);line-height:1.5;transition:color .2s}
.item-text.on{color:rgba(196,192,191,.4);text-decoration:line-through;text-decoration-color:rgba(196,192,191,.3)}
/* Done banner */
.done-banner{display:none;margin-bottom:12px;padding:18px;background:rgba(135,177,95,.12);border:1px solid rgba(135,177,95,.35);border-radius:14px;text-align:center}
.done-banner.show{display:block}
.done-icon{width:44px;height:44px;background:rgba(135,177,95,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.done-icon svg{width:22px;height:22px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.done-title{font-size:15px;font-weight:700;color:var(--green);margin-bottom:2px}
.done-sub{font-size:12px;color:rgba(135,177,95,.7)}
/* Gallery */
.gallery-header{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.gallery-label{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--silver);text-transform:uppercase}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.thumb{border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--border);position:relative;aspect-ratio:3/4;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:active{opacity:.85}
.thumb-cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(18,18,18,.88));padding:24px 10px 10px}
.thumb-cap span{font-size:11px;font-weight:600;color:var(--gray-l);line-height:1.3}
/* Lightbox */
.lb{display:none;position:fixed;inset:0;background:rgba(10,10,10,.97);z-index:999;padding:20px}
.lb.open{display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:10px}
.lb-label{font-size:15px;font-weight:700;color:var(--gray-l);margin-top:14px;text-align:center}
.lb-desc{font-size:12px;color:var(--silver);margin-top:4px;text-align:center}
.lb-close{position:absolute;top:16px;right:16px;width:36px;height:36px;background:var(--surface);border:1px solid var(--border-m);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lb-close svg{width:18px;height:18px;stroke:var(--gray-l);fill:none;stroke-width:2;stroke-linecap:round}
.lb-nav{display:flex;gap:10px;margin-top:16px}
.lb-nav button{padding:9px 22px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;color:var(--gray-l);background:var(--surface);border:1px solid var(--border-m);border-radius:8px;cursor:pointer}
/* Nota */
.nota{background:var(--surface);border-radius:10px;border-left:3px solid var(--green);padding:13px 16px;margin-bottom:14px}
.nota p{font-size:12px;color:var(--silver);line-height:1.6}
.nota strong{color:var(--gray-l);font-weight:600}
/* Reset */
.reset-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--silver);background:transparent;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.reset-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <p class="brand">CrossFit Metropolitano · Getafe</p>
    <div class="header-row">
      <p class="page-title" id="page-title">Apertura</p>
      <span class="date-badge" id="date-badge"></span>
    </div>
    <div class="progress-wrap">
      <div class="progress-labels">
        <span class="progress-label">Completado</span>
        <span class="progress-count" id="prog-count">0 / 17</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tb-a" onclick="switchTab('apertura')">☀️ Apertura</button>
      <button class="tab-btn inactive" id="tb-c" onclick="switchTab('cierre')">🌙 Cierre</button>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">
    <div id="done-banner" class="done-banner">
      <div class="done-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="done-title" id="done-title">¡Box listo para entrenar!</p>
      <p class="done-sub" id="done-sub"></p>
    </div>

    <div id="checklist-sections"></div>

    <!-- Fotos de referencia -->
    <div class="gallery-header">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--silver)" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span class="gallery-label">Fotos de referencia</span>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>

    <div class="nota">
      <p><strong>Recuerda:</strong> El box debe quedar siempre en las mismas condiciones o mejor de cómo se encontró. Cualquier persona debe poder abrir o cerrar sin dudas.</p>
    </div>

    <button class="reset-btn" onclick="resetAll()">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Reiniciar checklist
    </button>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" onclick="closeLB(event)">
  <div class="lb-close" onclick="closeLB()">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <img id="lb-img" src="" alt=""/>
  <p class="lb-label" id="lb-label"></p>
  <p class="lb-desc" id="lb-desc"></p>
  <div class="lb-nav">
    <button onclick="lbNav(-1)">← Anterior</button>
    <button onclick="lbNav(1)">Siguiente →</button>
  </div>
</div>

let tab='apertura', checked=new Set(), lbIdx=0;

function allItems(t){return DATA[t].flatMap(s=>s.items)}

function render(){
  const secs=DATA[tab], items=allItems(tab);
  const done=items.filter(i=>checked.has(i.id)).length, total=items.length;
  document.getElementById('prog-count').textContent=done+' / '+total;
  document.getElementById('prog-fill').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('page-title').textContent=tab==='apertura'?'Apertura':'Cierre';
  const banner=document.getElementById('done-banner');
  if(done===total&&total>0){
    banner.classList.add('show');
    document.getElementById('done-title').textContent=tab==='apertura'?'¡Box listo para entrenar!':'¡Box cerrado correctamente!';
    document.getElementById('done-sub').textContent=done+' de '+total+' ítems completados';
  }else{banner.classList.remove('show')}
  document.getElementById('checklist-sections').innerHTML=secs.map(sec=>{
    const sd=sec.items.filter(i=>checked.has(i.id)).length, st=sec.items.length;
    return `<div class="section-card">
      <div class="section-head">
        <div class="section-icon">${SVG[sec.icon]}</div>
        <span class="section-title">${sec.title}</span>
        <span class="section-count ${sd===st?'done':''}"> ${sd}/${st}</span>
      </div>
      ${sec.items.map(it=>`
        <div class="item" onclick="toggle('${it.id}')">
          <div class="checkbox ${checked.has(it.id)?'on':''}">
            <div class="checkmark"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><polyline points="1,4.5 4,7.5 10,1" stroke="#121212" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <span class="item-text ${checked.has(it.id)?'on':''}">${it.text}</span>
        </div>`).join('')}
    </div>`;
  }).join('');
}

function toggle(id){if(checked.has(id))checked.delete(id);else checked.add(id);render()}

function switchTab(t){
  tab=t;
  document.getElementById('tb-a').className='tab-btn '+(t==='apertura'?'active':'inactive');
  document.getElementById('tb-c').className='tab-btn '+(t==='cierre'?'active':'inactive');
  render();
}

function resetAll(){checked=new Set();render()}

// Gallery — set img.src as property (not via innerHTML) to avoid parsing issues
function renderGallery(){
  const grid=document.getElementById('gallery-grid');
  grid.innerHTML='';
  IMGS.forEach(function(img,i){
    const div=document.createElement('div');
    div.className='thumb';
    div.onclick=function(){openLB(i)};
    const el=document.createElement('img');
    el.alt=img.label;
    el.src=img.src;
    const cap=document.createElement('div');
    cap.className='thumb-cap';
    cap.innerHTML='<span>'+img.label+'</span>';
    div.appendChild(el);
    div.appendChild(cap);
    grid.appendChild(div);
  });
}

let lbOpen=false;
function openLB(i){lbIdx=i;updateLB();document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden'}
function closeLB(e){
  if(!e||e.target===document.getElementById('lb')||e.currentTarget.classList.contains('lb-close')){
    document.getElementById('lb').classList.remove('open');document.body.style.overflow='';
  }
}
function lbNav(d){lbIdx=(lbIdx+d+IMGS.length)%IMGS.length;updateLB()}
function updateLB(){
  const img=IMGS[lbIdx];
  document.getElementById('lb-img').src=img.src;
  document.getElementById('lb-label').textContent=img.label;
  document.getElementById('lb-desc').textContent=img.desc;
}

// Date
const d=new Date();
const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
document.getElementById('date-badge').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];

renderGallery();
render();
</script>
