server {
    listen 80;
    listen [::]:80;
    server_name entrenos.crossfitmpo.com;

    # Web root = the self-contained app folder from this repo
    root /var/www/crossfitmpo-apps/entrenos;
    index index.html;

    # Static SPA-style: serve file or fall back to index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker (so updates roll out)
    location = /entrenos-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /entrenos.webmanifest {
        default_type application/manifest+json;
    }

    # Long-cache the logo asset
    location ~* \.(png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
